<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velwaves Tier List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            text-align: center;
            padding: 35px 15px;
            background: #111118;
            border-bottom: 1px solid #292934;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 900;
        }

        header p {
            margin-top: 8px;
            color: #999;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .gamemode {
            margin-bottom: 35px;
        }

        .gamemode-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .tier {
            display: flex;
            min-height: 80px;
            margin-bottom: 8px;
            border-radius: 10px;
            overflow: hidden;
            background: #15151d;
            border: 1px solid #292934;
        }

        .tier-name {
            width: 100px;
            min-width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
        }

        .players {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            flex-wrap: wrap;
        }

        .player {
            background: #20202a;
            border: 1px solid #343441;
            border-radius: 8px;
            padding: 12px 18px;
            font-weight: 800;
        }

        .ht1 { background: #e53935; }
        .lt1 { background: #ef5350; }

        .ht2 { background: #ff8f00; }
        .lt2 { background: #ffa726; }

        .ht3 { background: #fdd835; color: #111; }
        .lt3 { background: #ffee58; color: #111; }

        .ht4 { background: #43a047; }
        .lt4 { background: #66bb6a; }

        .ht5 { background: #1e88e5; }
        .lt5 { background: #42a5f5; }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            .tier-name {
                width: 75px;
                min-width: 75px;
                font-size: 15px;
            }

            .player {
                padding: 9px 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Velwaves Tier List</h1>
    <p>Minecraft PvP Rankings</p>
</header>

<div class="container">

    <!-- SWORD -->
    <div class="gamemode">
        <div class="gamemode-title">⚔️ SWORD</div>

        <div class="tier">
            <div class="tier-name ht1">HT1</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name lt1">LT1</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name ht2">HT2</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name lt2">LT2</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name ht3">HT3</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name lt3">LT3</div>
            <div class="players">
                <div class="player">Krufiex</div>
            </div>
        </div>

        <div class="tier">
            <div class="tier-name ht4">HT4</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name lt4">LT4</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name ht5">HT5</div>
            <div class="players"></div>
        </div>

        <div class="tier">
            <div class="tier-name lt5">LT5</div>
            <div class="players"></div>
        </div>
    </div>

</div>

<footer>
    VelwavesTierList • Sword Rankings
</footer>

</body>
</html>

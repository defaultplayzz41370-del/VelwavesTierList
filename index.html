* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #09090d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: #111117;
    border-bottom: 1px solid #292933;
}

header h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 900;
}

header p {
    color: #888;
    margin-top: 8px;
}

.container {
    width: 95%;
    max-width: 1150px;
    margin: 35px auto;
}

.gamemode {
    margin-bottom: 45px;
}

.gamemode-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 14px;
}

.tier {
    display: flex;
    min-height: 75px;
    margin-bottom: 7px;
    background: #15151d;
    border: 1px solid #292933;
    border-radius: 10px;
    overflow: hidden;
}

.tier-name {
    width: 100px;
    min-width: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 19px;
    font-weight: 900;
}

.players {
    flex: 1;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
}

.player {
    padding: 12px 18px;
    background: #20202a;
    border: 1px solid #363642;
    border-radius: 8px;
    font-weight: 800;
}

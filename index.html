<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelwavesTierList</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #07070a;
    color: white;
}

/* NAVBAR */
header {
    height: 70px;
    background: #0c0c11;
    border-bottom: 1px solid #24242d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 22px;
    font-weight: 900;
}

.logo span {
    color: #8b5cf6;
}

nav {
    display: flex;
    gap: 25px;
}

nav button {
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-weight: 700;
}

nav button:hover {
    color: white;
}

/* HERO */
.hero {
    text-align: center;
    padding: 80px 20px 50px;
    background:
        radial-gradient(
            circle at center,
            rgba(139,92,246,.18),
            transparent 55%
        );
}

.hero h1 {
    font-size: 55px;
    font-weight: 1000;
}

.hero h1 span {
    color: #8b5cf6;
}

.hero p {
    color: #8c8c96;
    margin-top: 12px;
    font-size: 16px;
}

/* SEARCH */
.searchBox {
    max-width: 900px;
    margin: 0 auto 30px;
    padding: 0 20px;
}

.search {
    width: 100%;
    background: #101016;
    border: 1px solid #2a2a35;
    border-radius: 12px;
    padding: 17px;
    color: white;
    outline: none;
    font-size: 15px;
}

.search:focus {
    border-color: #8b5cf6;
}

/* GAMEMODES */
.modes {
    max-width: 1100px;
    margin: auto;
    padding: 0 20px 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.mode {
    background: #111117;
    border: 1px solid #292933;
    color: #aaa;
    padding: 11px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 800;
    transition: .15s;
}

.mode:hover {
    border-color: #8b5cf6;
    color: white;
}

.mode.active {
    background: #8b5cf6;
    color: white;
    border-color: #8b5cf6;
}

/* MAIN */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 0 20px 80px;
}

.title {
    font-size: 27px;
    margin-bottom: 18px;
}

/* TIERS */
.tier {
    display: flex;
    min-height: 76px;
    margin-bottom: 8px;
    background: #101015;
    border: 1px solid #292933;
    border-radius: 9px;
    overflow: hidden;
}

.tierName {
    width: 90px;
    min-width: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 1000;
}

.players {
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
}

.player {
    background: #191920;
    border: 1px solid #30303b;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 800;
    transition: .15s;
}

.player:hover {
    border-color: #8b5cf6;
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(139,92,246,.15);
}

/* TIER COLORS */
.ht1 {
    background: #ff3030;
}

.lt1 {
    background: #ff6666;
}

.ht2 {
    background: #ff8300;
}

.lt2 {
    background: #ffa83d;
}

.ht3 {
    background: #ffd000;
    color: #111;
}

.lt3 {
    background: #ffe477;
    color: #111;
}

.ht4 {
    background: #48b94b;
}

.lt4 {
    background: #70d970;
}

.ht5 {
    background: #208eea;
}

.lt5 {
    background: #61b3f5;
}

/* PROFILE */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(7px);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.profile {
    width: 100%;
    max-width: 500px;
    background: #101016;
    border: 1px solid #30303a;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 80px rgba(0,0,0,.6);
}

.profileTop {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 25px;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    background: #8b5cf6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 1000;
}

.profile h2 {
    font-size: 25px;
}

.profile p {
    color: #888;
    margin-top: 5px;
}

.results {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.result {
    background: #18181f;
    border: 1px solid #292933;
    padding: 13px;
    border-radius: 9px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.resultTier {
    font-weight: 900;
}

.close {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #8b5cf6;
    color: white;
    font-weight: 900;
    cursor: pointer;
}

/* FOOTER */
footer {
    border-top: 1px solid #22222b;
    text-align: center;
    padding: 30px;
    color: #666;
}

/* MOBILE */
@media(max-width:600px) {

    header {
        padding: 0 20px;
    }

    nav {
        display: none;
    }

    .hero h1 {
        font-size: 38px;
    }

    .tierName {
        width: 65px;
        min-width: 65px;
        font-size: 13px;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        Velwaves<span>TierList</span>
    </div>

    <nav>
        <button onclick="scrollTopPage()">Home</button>
        <button onclick="focusSearch()">Players</button>
    </nav>

</header>


<section class="hero">

    <h1>
        Velwaves<span>TierList</span>
    </h1>

    <p>
        Minecraft PvP Rankings
    </p>

</section>


<div class="searchBox">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search for a player..."
        oninput="searchPlayer()"
    >

</div>


<div class="modes">

    <button class="mode active" onclick="changeMode('Sword', this)">
        ⚔️ Sword
    </button>

    <button class="mode" onclick="changeMode('Axe', this)">
        🪓 Axe
    </button>

    <button class="mode" onclick="changeMode('Crystal', this)">
        💎 Crystal
    </button>

    <button class="mode" onclick="changeMode('UHC', this)">
        🏹 UHC
    </button>

    <button class="mode" onclick="changeMode('NethPot', this)">
        🧪 NethPot
    </button>

    <button class="mode" onclick="changeMode('DiaPot', this)">
        🛡️ DiaPot
    </button>

    <button class="mode" onclick="changeMode('Spear', this)">
        🔱 Spear
    </button>

    <button class="mode" onclick="changeMode('Mace', this)">
        🔨 Mace
    </button>

</div>


<main class="container">

    <h2 class="title" id="title">
        ⚔️ Sword Rankings
    </h2>

    <div id="tiers"></div>

</main>


<footer>
    © 2026 VelwavesTierList
</footer>


<!-- PLAYER PROFILE -->

<div class="modal" id="modal">

    <div class="profile">

        <div class="profileTop">

            <div class="avatar" id="avatar">
                K
            </div>

            <div>

                <h2 id="profileName">
                    Player
                </h2>

                <p>
                    VelwavesTierList Player
                </p>

            </div>

        </div>

        <div class="results" id="results"></div>

        <button class="close" onclick="closeProfile()">
            Close
        </button>

    </div>

</div>


<script>

/*
==================================================
PLAYER DATABASE
==================================================

Add players here later.

Example:

{
    name: "PlayerName",

    results: {
        Sword: "HT3",
        Axe: "LT2",
        Mace: "HT4"
    }
}

==================================================
*/

const players = [

    {
        name: "Krufiex",

        results: {
            Sword: "LT3"
        }
    }

];


/*
==================================================
GAME MODES
==================================================
*/

const modes = [
    "Sword",
    "Axe",
    "Crystal",
    "UHC",
    "NethPot",
    "DiaPot",
    "Spear",
    "Mace"
];


/*
==================================================
TIERS
==================================================
*/

const tiers = [
    "HT1",
    "LT1",
    "HT2",
    "LT2",
    "HT3",
    "LT3",
    "HT4",
    "LT4",
    "HT5",
    "LT5"
];


let currentMode = "Sword";


/*
==================================================
RENDER TIER LIST
==================================================
*/

function render() {

    const container =
        document.getElementById("tiers");

    container.innerHTML = "";


    tiers.forEach(tier => {

        const row =
            document.createElement("div");

        row.className = "tier";


        const tierName =
            document.createElement("div");

        tierName.className =
            "tierName " + tier.toLowerCase();

        tierName.textContent = tier;


        const playerContainer =
            document.createElement("div");

        playerContainer.className = "players";


        const matchingPlayers =
            players.filter(player => {

                return player.results[currentMode] === tier;

            });


        if (matchingPlayers.length === 0) {

            const empty =
                document.createElement("span");

            empty.style.color = "#555";

            empty.textContent = "No players";

            playerContainer.appendChild(empty);

        } else {

            matchingPlayers.forEach(player => {

                const element =
                    document.createElement("div");

                element.className = "player";

                element.textContent = player.name;

                element.onclick = () => {
                    openProfile(player);
                };

                playerContainer.appendChild(element);

            });

        }


        row.appendChild(tierName);

        row.appendChild(playerContainer);

        container.appendChild(row);

    });

}


/*
==================================================
CHANGE GAMEMODE
==================================================
*/

function changeMode(mode, button) {

    currentMode = mode;


    document
        .querySelectorAll(".mode")
        .forEach(btn => {
            btn.classList.remove("active");
        });


    button.classList.add("active");


    document.getElementById("title")
        .textContent =
        "🏆 " + mode + " Rankings";


    render();

    searchPlayer();

}


/*
==================================================
SEARCH PLAYER
==================================================
*/

function searchPlayer() {

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    document
        .querySelectorAll(".player")
        .forEach(player => {

            const name =
                player.textContent.toLowerCase();

            if (name.includes(query)) {

                player.style.display = "block";

            } else {

                player.style.display = "none";

            }

        });

}


/*
==================================================
OPEN PROFILE
==================================================
*/

function openProfile(player) {

    document.getElementById("modal")
        .style.display = "flex";


    document.getElementById("profileName")
        .textContent = player.name;


    document.getElementById("avatar")
        .textContent =
        player.name.charAt(0).toUpperCase();


    const results =
        document.getElementById("results");

    results.innerHTML = "";


    modes.forEach(mode => {

        const tier =
            player.results[mode];


        if (!tier) {
            return;
        }


        const result =
            document.createElement("div");

        result.className = "result";


        const modeName =
            document.createElement("span");

        modeName.textContent = mode;


        const tierElement =
            document.createElement("strong");

        tierElement.className = "resultTier";

        tierElement.textContent = tier;


        result.appendChild(modeName);

        result.appendChild(tierElement);

        results.appendChild(result);

    });

}


/*
==================================================
CLOSE PROFILE
==================================================
*/

function closeProfile() {

    document.getElementById("modal")
        .style.display = "none";

}


/*
==================================================
NAVIGATION
==================================================
*/

function focusSearch() {

    document
        .getElementById("search")
        .focus();

}


function scrollTopPage() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
==================================================
CLOSE PROFILE WHEN CLICKING OUTSIDE
==================================================
*/

document.getElementById("modal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeProfile();
        }

    });


/*
==================================================
START
==================================================
*/

render();

</script>

</body>
</html>
